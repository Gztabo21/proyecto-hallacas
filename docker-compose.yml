services:
  app:
    build: .
    container_name: hallacas_jireh_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: hallacas_jireh
      DB_USER: hallacas
      DB_PASS: hallacas_secret
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: hallacas_jireh_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: hallacas_jireh
      MYSQL_USER: hallacas
      MYSQL_PASSWORD: hallacas_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
